{% extends 'frontend/base.html' %}

{% block title %}Upload Your Thesis – Thesis Check{% endblock %}

{% block content %}
<section class="upload-section">
    <div class="upload-inner">
        <h1 class="upload-title">Upload Your Thesis</h1>

        <p class="upload-subtitle">
            Upload your thesis for plagiarism and grammar analysis
        </p>

        <div class="upload-dropzone">
            <div class="upload-cloud">☁️</div>
            <p class="upload-drop-main">Drag &amp; Drop your thesis file here</p>
            <p class="upload-drop-sub">or click to browse your files</p>
        </div>

        <button class="upload-button">
            Upload Thesis
        </button>
    </div>
</section>
{% endblock %}
